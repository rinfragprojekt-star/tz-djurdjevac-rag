steps:
  # 1) Build Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/tz-djurdjevac-rag', '.']

  # 2) Push image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/tz-djurdjevac-rag']

  # 3) Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      [
        'run', 'deploy', 'tz-djurdjevac-rag',
        '--image', 'gcr.io/$PROJECT_ID/tz-djurdjevac-rag',
        '--region', 'europe-central2',
        '--platform', 'managed',
        '--allow-unauthenticated'
      ]

images:
  - 'gcr.io/$PROJECT_ID/tz-djurdjevac-rag'
